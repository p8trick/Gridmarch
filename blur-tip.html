<style>
html,body{margin:0;width:100vw;height:100vh;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:15px -apple-system,system-ui,sans-serif;color:#fff}
#stage{background:#000}
#box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--sh)*3.4);padding:0 80px;text-align:center}
h1{margin:0;font-size:calc(var(--sh)*6.2);letter-spacing:.06em;font-weight:700}
p{margin:0;max-width:calc(var(--sw)*62);line-height:1.7;font-size:calc(var(--sh)*4.1);color:rgba(255,255,255,.86)}
p b{color:#ffc857;font-weight:700}
#back{min-width:calc(var(--sh)*34);height:calc(var(--sh)*11);padding:0 26px;border-radius:14px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;font:700 calc(var(--sh)*4.6)/1 -apple-system,system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#back:active{background:rgba(255,255,255,.22)}
/* 手势起点示意：系统「返回」手势从屏幕物理左边缘起手向内划；虚拟横屏下这条边在舞台的下边（rot 90）/ 上边（rot -90），真横屏在左边 */
.edge{position:absolute;display:none;pointer-events:none}
.edge i{position:absolute;background:#ffc857;box-shadow:0 0 12px 2px rgba(255,200,87,.7)}
.edge svg{position:absolute;overflow:visible}
.edge em{position:absolute;font-style:normal;font-size:calc(var(--sh)*3.6);color:#ffc857;white-space:nowrap;font-weight:700}
.rb .eb,.rt .et,.rl .el{display:block}
.rb #box{padding-bottom:96px}
.rt #box{padding-top:96px}
.rl #box{padding-left:130px}
@keyframes sw-up{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
@keyframes sw-dn{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes sw-rt{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(34px);opacity:0}}
/* 下边（rot 90）：亮条贴舞台下边，手指点在亮条中间向上划 */
.eb{left:0;right:0;bottom:0;height:70px}
.eb i{left:0;right:0;bottom:0;height:5px}
.eb svg{left:50%;bottom:10px;width:30px;height:46px;margin-left:-15px;animation:sw-up 1.5s ease-in-out infinite}
.eb em{left:50%;bottom:24px;margin-left:34px}
/* 上边（rot -90） */
.et{left:0;right:0;top:0;height:70px}
.et i{left:0;right:0;top:0;height:5px}
.et svg{left:50%;top:10px;width:30px;height:46px;margin-left:-15px;animation:sw-dn 1.5s ease-in-out infinite}
.et em{left:50%;top:24px;margin-left:34px}
/* 左边（真横屏） */
.el{top:0;bottom:0;left:0;width:90px}
.el i{top:0;bottom:0;left:0;width:5px}
.el svg{top:50%;left:10px;width:46px;height:30px;margin-top:-15px;animation:sw-rt 1.5s ease-in-out infinite}
.el em{left:14px;top:50%;margin-top:-62px;width:84px;white-space:normal;line-height:1.3}
</style>
