name: apply-package
# 手机上更新：把升级包 / 完整包 zip 传到仓库【根目录】，机器人自动解压、覆盖、删文件，并删掉这个 zip。
# 说明见 README「手机网页更新」。这个文件本身机器人没权限改（GitHub 限制），要改只能手动上传。
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
concurrency:
  group: apply-package
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解包并应用
        run: python3 tools/apply-package.py
      - name: 提交
        run: |
          git config user.name "gridmarch-bot"
          git config user.email "gridmarch-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -F "${RUNNER_TEMP}/apply-message.txt"
          git push || (git pull --rebase && git push)
