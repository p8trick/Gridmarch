<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>单位渲染模块演示</title>
<style>html,body{margin:0;height:100%;background:#2b3033;overflow:hidden}#c,#c canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;font:600 11px ui-monospace,Menlo,monospace;color:#fff;background:#0007;white-space:pre-line}
#p{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0009;display:grid;gap:6px}
.r{display:flex;gap:5px;align-items:center}.r span{font:11px sans-serif;color:#b8bfb4;width:34px;flex:none}.r button{flex:1;font:600 12px -apple-system,sans-serif;padding:9px 2px;border:0;border-radius:8px;background:#3a4144;color:#dfe3dc}.r button.on{background:#b7c49a;color:#1d2218}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<div id="c"></div><div id="hud">加载中…</div>
<div id="p">
<div class="r"><span>画质</span><button data-q="high">最高</button><button data-q="mid">中</button><button data-q="low">低</button><button data-q="min">最低</button></div>
<div class="r"><span>阴影</span><button data-s="off">关</button><button data-s="low">低</button><button data-s="high">高</button><button id="au">自动降画质:开</button></div>
<div class="r"><span>镜头</span><button id="rl">⟲90°</button><button id="rr">⟳90°</button><button data-t="5">5格</button><button data-t="7">7格</button><button data-t="9">9格</button></div>
<div class="r"><span>坦克</span><button data-k="0">0</button><button data-k="5">5</button><button data-k="10">10</button><button data-k="20">20</button><button id="sc">炮塔扫描:关</button></div>
<div class="r"><span>其他</span><button id="mv">行军</button><button id="rg">底圈:关</button><button id="od">按需渲染:开</button></div>
</div>
<script type="module" src="unit-demo.js"></script></body></html>
