<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14181f">
<title>类高战 V0.1</title>
<style>
:root{color-scheme:dark;--bg:#14181f;--fg:#e8ecf2;--panel:#1d232d;--line:#2c3441}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#panel{padding:8px 10px;min-height:96px;background:var(--panel);border-top:1px solid var(--line)}
#info{font-size:13px;min-height:34px;margin-bottom:6px;opacity:.9}
#btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;padding:9px 13px;border-radius:8px;border:1px solid #3a4558;background:#2a3342;color:var(--fg)}
button:active{background:#38445a}
button:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="board"><canvas id="c"></canvas></div>
  <div id="panel"><div id="info"></div><div id="btns"></div></div>
</div>
<script type="module" src="./ui.js"></script>
</body>
</html>
