<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方寸战线">
<meta name="theme-color" content="#0b1e36">
<title>方寸战线 · Gridmarch</title>
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- 启动图：必须是 PNG；iOS 要求 media 与设备精确匹配。仅 iPad 横屏；iPhone 不做（竖屏锁定时主页会自己转成横屏，见 src/battle/stage.js） -->
<link rel="apple-touch-startup-image" href="assets/splash/ipad-2360x1640-landscape.png"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
<style>html,body{background:#0b1e36}
#ver{position:absolute;right:12px;bottom:8px;z-index:2;font:11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.55);pointer-events:none}</style>
<script>
/* ★ 版本号：整个项目唯一的位置。每次更新文件后改这里（比如 0.1.0 → 0.1.1），主页自己的 css/js 和所有页面
   （战场、测试页）都会跟着换新文件，绕开 iOS 的死缓存。 */
window.GM_VERSION = '0.24';
document.write('<link rel="stylesheet" href="home.css?v=' + GM_VERSION + '">');
</script>
</head>
<body>
<div id="stage">
<img class="bg" id="bg" alt="" decoding="async">
<div class="scrim"></div>

<main class="home">
  <h1 class="title"><img id="title" src="assets/title/title-zh.webp" alt="方寸战线" decoding="async"></h1>
  <nav><ul id="menu" class="menu"></ul></nav>
</main>

<button id="flip" class="flip" type="button" data-i18n="flip" hidden>换边</button>
<div id="toast" class="toast" role="status"></div>
<div id="ver" aria-hidden="true"></div>

<section id="settings" class="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <header class="panel-head">
      <h2 data-i18n="settings">设置</h2>
      <button id="closeSettings" class="close" type="button" aria-label="关闭">✕</button>
    </header>
    <div class="row">
      <span data-i18n="language">语言</span>
      <div class="seg">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <div class="row"><span data-i18n="quality">画质</span><em data-i18n="soon">即将开放</em></div>
    <div class="row"><span data-i18n="volume">音量</span><em data-i18n="soon">即将开放</em></div>
  </div>
</section>
</div>

<script>document.write('<script src="home.js?v=' + GM_VERSION + '"><\/script>');</script>
</body>
</html>
