<script type="module">
const showError=e=>{document.getElementById('loading').hidden=true;const el=document.getElementById('error');el.hidden=false;el.textContent='启动失败：'+(e?.stack||e?.message||String(e))};
try{
 const base64=document.getElementById('bundle').textContent.trim();
 if(typeof DecompressionStream!=='function')throw Error('浏览器不支持 DecompressionStream，建议用最新版 Safari/Chrome。');
 const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const sources=JSON.parse(await new Response(stream).text());
 const cached=new Map(),building=new Set();
 const importPattern=/(\bfrom\s*|\bimport\s*)(['"])(\.[^'"]+)\2/g;
 function resolve(base,rel){const parts=base.split('/');parts.pop();for(const p of rel.split('/')){if(p==='.'||!p)continue;if(p==='..')parts.pop();else parts.push(p);}return parts.join('/');}
 function moduleUrl(name){
  if(cached.has(name))return cached.get(name);
  if(building.has(name))throw Error('模块引用循环：'+name);
  if(!(name in sources))throw Error('找不到模型模块：'+name);
  building.add(name);
  const code=sources[name].replace(importPattern,(match,prefix,quote,rel)=>`${prefix}${quote}${moduleUrl(resolve(name,rel))}${quote}`);
  building.delete(name);
  const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));cached.set(name,url);return url;
 }
 await import(moduleUrl('test-entry.js'));
}catch(e){console.error(e);showError(e)}
</script>
