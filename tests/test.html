<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PWA顶栏测试v2" />
  <meta name="theme-color" content="#0b1021" id="meta-theme" />
  <title>PWA 顶栏社区偏方测试 v3</title>
  <link rel="manifest" id="pwa-manifest" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b1021;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 顶部高对比彩条：紧贴屏幕最上沿，专门观察灵动岛两侧模糊/发白 */
    .top-strip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(90deg, #ef4444 0%, #f59e0b 25%, #10b981 50%, #3b82f6 75%, #ec4899 100%);
    }

    /* 偏方 A：动态位移 + 实心绘制节点（32px 高度，带实心背景绘制） */
    #anim-node {
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      height: 32px;
      background: rgba(11, 16, 33, 0.08);
      z-index: 22;
      pointer-events: none;
      opacity: 0;
      transition: top 0.35s ease, opacity 0.2s ease, background 0.2s ease;
    }

    /* 偏方 B：抽屉/面板滑入滑出重绘触发器 */
    #drawer-probe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: rgba(56, 189, 248, 0.12);
      transform: translateY(-100%);
      transition: transform 0.28s ease;
      z-index: 25;
      pointer-events: none;
    }

    /* 偏方 C：较高高度（48px）微弱层测试 */
    #tall-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 0px;
      background: transparent;
      z-index: 20;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 30;
      padding: calc(env(safe-area-inset-top, 0px) + 64px) 14px 48px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #7dd3fc;
    }
    .desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.45;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 6px 6px 0;
      font-size: 13px;
      touch-action: manipulation;
    }
    button.on {
      background: #0284c7;
      border-color: #38bdf8;
    }
    #log {
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="top-strip"></div>
  <div id="anim-node"></div>
  <div id="drawer-probe"></div>
  <div id="tall-shield"></div>

  <div class="wrap">
    <div class="card">
      <div class="title">v3 社区偏方验证状态</div>
      <div id="log">等待点击偏方按钮...</div>
    </div>

    <div class="card">
      <div class="title">偏方 A：动态位移 + 实心绘制（32px 高）</div>
      <div class="desc">先从下方移到顶部停留，观察首屏静态节点被忽略时，动态位移能否让顶部模糊消失。</div>
      <button onclick="runAnimShift(0)">位移到 top: 0 (8%黑)</button>
      <button onclick="runAnimShift(4)">位移到 top: 4px (8%黑)</button>
      <button onclick="runAnimShift(0, 'rgba(11,16,33,0.22)')">位移到 top: 0 (22%深蓝)</button>
      <button onclick="hideAnimNode()">隐藏位移节点</button>
    </div>

    <div class="card">
      <div class="title">偏方 B：模拟抽屉滑入滑出重绘</div>
      <div class="desc">短暂停留后滑出，测试动画/图层切换是否会顺带清掉顶部残留的毛玻璃。</div>
      <button onclick="runDrawerSweep(600)">滑入停留 0.6s 后滑出</button>
      <button onclick="runDrawerSweep(2000)">滑入停留 2.0s 后滑出</button>
    </div>

    <div class="card">
      <div class="title">偏方 C：拉高覆盖高度（36px / 48px）</div>
      <div class="desc">测试高度达到 36px～48px 时的微弱遮罩效果（不走纯黑）。</div>
      <button onclick="setTallShield(36, 'rgba(0,0,0,0.05)')">36px 高 / 5%黑</button>
      <button onclick="setTallShield(48, 'rgba(0,0,0,0.08)')">48px 高 / 8%黑</button>
      <button onclick="setTallShield(48, 'rgba(11,16,33,0.18)')">48px 高 / 18%深蓝</button>
      <button onclick="setTallShield(0, 'transparent')">关闭该层</button>
    </div>

    <div class="card">
      <div class="title">背景明暗切换</div>
      <button onclick="setBg('#0b1021', '#f1f5f9')">深色背景</button>
      <button onclick="setBg('#ffffff', '#0f172a')">纯白背景</button>
    </div>
  </div>

  <script>
    (function () {
      try {
        var m = {
          name: "顶栏测试v2",
          short_name: "顶栏测试v2",
          start_url: location.href,
          display: "standalone",
          background_color: "#0b1021",
          theme_color: "#0b1021"
        };
        var blob = new Blob([JSON.stringify(m)], { type: "application/manifest+json" });
        document.getElementById("pwa-manifest").href = URL.createObjectURL(blob);
      } catch (e) {}
    })();

    function logMsg(txt) {
      var mode = window.navigator.standalone ? "Standalone" : "Safari";
      document.getElementById("log").innerHTML =
        "模式: <b>" + mode + "</b> | 窗口: " + innerWidth + "x" + innerHeight + "<br>" +
        "最近操作: <b>" + txt + "</b>";
    }

    function runAnimShift(targetTop, bg) {
      var el = document.getElementById("anim-node");
      el.style.transition = "none";
      el.style.top = "36px";
      el.style.opacity = "1";
      el.style.background = bg || "rgba(11, 16, 33, 0.08)";
      void el.offsetHeight;
      el.style.transition = "top 0.35s ease, opacity 0.2s ease, background 0.2s ease";
      el.style.top = targetTop + "px";
      logMsg("偏方A: 32px节点位移至 top:" + targetTop + "px");
    }

    function hideAnimNode() {
      var el = document.getElementById("anim-node");
      el.style.opacity = "0";
      logMsg("偏方A: 隐藏位移节点");
    }

    function runDrawerSweep(holdMs) {
      var d = document.getElementById("drawer-probe");
      d.style.transform = "translateY(0%)";
      logMsg("偏方B: 面板滑入，停留 " + holdMs + "ms 后滑出");
      setTimeout(function () {
        d.style.transform = "translateY(-100%)";
        logMsg("偏方B: 面板已滑出，观察顶部是否变清");
      }, holdMs);
    }

    function setTallShield(h, bg) {
      var s = document.getElementById("tall-shield");
      s.style.height = h + "px";
      s.style.background = bg;
      logMsg("偏方C: 高度=" + h + "px, 背景=" + bg);
    }

    function setBg(bg, fg) {
      document.documentElement.style.background = bg;
      document.body.style.background = bg;
      document.body.style.color = fg;
      logMsg("背景 -> " + bg);
    }

    logMsg("v3 偏方测试页已就绪");
  </script>
</body>
</html>
