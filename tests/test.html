<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  
  <!-- PWA 主屏幕应用配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta id="meta-status-bar" name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iOS27 Blur Lab" />
  
  <title>iOS 27 状态栏模糊全偏方实验室</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #f4f5f7;
      --text-color: #111111;
      --sub-text: #555555;
      --border-color: #e0e0e0;
      --accent: #007aff;
      --blocker-solid: #ffffff;
      --blocker-semi: rgba(255, 255, 255, 0.85);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: #161618;
        --text-color: #f5f5f7;
        --sub-text: #98989d;
        --border-color: #2c2c2e;
        --accent: #0a84ff;
        --blocker-solid: #000000;
        --blocker-semi: rgba(0, 0, 0, 0.85);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* 模式 1：整页默认滚动 */
    body.mode-window-scroll {
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
      padding-left: 14px;
      padding-right: 14px;
    }

    /* 模式 2：内部独立滚动容器（方案 D） */
    body.mode-inner-scroll {
      height: 100dvh;
      overflow: hidden;
    }
    body.mode-inner-scroll #scroll-wrapper {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
      padding-left: 14px;
      padding-right: 14px;
    }

    /* 方案 A：顶部防模糊色条 */
    #top-blocker {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--blocker-solid);
      z-index: 9999;
      pointer-events: none;
      transition: height 0.15s ease, background-color 0.15s ease;
    }

    /* 方案 C：JS 合成层欺骗用临时图层 */
    #compositor-hack-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(128, 128, 128, 0.01);
      transform: translateY(-100%);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 9997;
      pointer-events: none;
    }
    #compositor-hack-layer.active {
      transform: translateY(0);
    }

    /* 灵动岛下沿参考标尺线 */
    #island-guide {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0;
      right: 0;
      border-top: 1px dashed rgba(255, 59, 48, 0.7);
      z-index: 9998;
      pointer-events: none;
    }
    #island-guide::after {
      content: "safe-area-inset-top (灵动岛下沿)";
      position: absolute;
      right: 8px;
      top: 2px;
      font-size: 10px;
      color: #ff3b30;
      font-family: monospace;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--sub-text);
      margin: 10px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-badge {
      font-size: 12px;
      font-family: monospace;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .btn-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    button.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .hint {
      font-size: 11px;
      color: var(--sub-text);
      margin-top: 6px;
    }

    .feed-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .feed-item h3 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .feed-item p {
      font-size: 13px;
      color: var(--sub-text);
    }

    .color-bar {
      height: 5px;
      border-radius: 3px;
      margin-top: 8px;
      background: linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de);
    }
  </style>
</head>
<body class="mode-window-scroll">

  <div id="top-blocker"></div>
  <div id="compositor-hack-layer"></div>
  <div id="island-guide"></div>

  <div id="scroll-wrapper">
    <div class="panel">
      <h1>iOS 27 状态栏模糊全偏方实验室</h1>
      <div class="status-badge" id="status-text">加载完成：当前为 2px 不透明顶部色条</div>

      <!-- 方案 A -->
      <div class="section-title">方案 A：顶部边缘色条高度（欺骗顶边检测）</div>
      <div class="btn-grid-3" id="height-btns">
        <button onclick="setHeight('0px', this)">0px（无遮挡）</button>
        <button onclick="setHeight('1px', this)">1px 极细</button>
        <button class="active" onclick="setHeight('2px', this)">2px 极细</button>
        <button onclick="setHeight('6px', this)">6px 窄条</button>
        <button onclick="setHeight('env(safe-area-inset-top)', this)">齐平灵动岛</button>
        <button id="btn-opacity" onclick="toggleOpacity()">当前：纯色</button>
      </div>

      <!-- 方案 B & C -->
      <div class="section-title">方案 B & C：WebKit 图层 Hack 与状态栏 Meta</div>
      <div class="btn-grid-2">
        <button onclick="triggerCompositorHack()">运行 JS 图层滑动 Hack</button>
        <button id="btn-meta" onclick="toggleStatusBarMeta()">Meta: black-translucent</button>
      </div>
      <div class="hint">注：若点「JS 图层滑动 Hack」后模糊瞬间消失，说明合成层欺骗有效；Meta 切换在部分版本需重新添加到主屏幕才生效。</div>

      <!-- 方案 D -->
      <div class="section-title">方案 D：滚动容器结构 & 辅助标尺</div>
      <div class="btn-grid-2">
        <button id="btn-scroll" onclick="toggleScrollMode()">滚动：整页 Window</button>
        <button id="btn-guide" class="active" onclick="toggleGuide()">红色参考线：开</button>
      </div>
    </div>

    <div id="feed-container"></div>
  </div>

  <script>
    const blocker = document.getElementById('top-blocker');
    const hackLayer = document.getElementById('compositor-hack-layer');
    const guide = document.getElementById('island-guide');
    const statusText = document.getElementById('status-text');
    const metaTag = document.getElementById('meta-status-bar');

    let currentHeight = '2px';
    let isSolid = true;
    let isInnerScroll = false;
    let showGuide = true;
    let metaMode = 'black-translucent';

    function logStatus(msg) {
      statusText.textContent = msg;
    }

    // 方案 A：切换高度
    function setHeight(h, btn) {
      currentHeight = h;
      blocker.style.display = h === '0px' ? 'none' : 'block';
      blocker.style.height = h;
      document.querySelectorAll('#height-btns button').forEach(b => {
        if (b.id !== 'btn-opacity') b.classList.remove('active');
      });
      btn.classList.add('active');
      const label = h === 'env(safe-area-inset-top)' ? '齐平灵动岛下沿' : h;
      logStatus(`方案 A：色条高度 = ${label}（${isSolid ? '不透明纯色' : '85% 半透明'}）`);
    }

    // 方案 A：切换纯色/半透明
    function toggleOpacity() {
      isSolid = !isSolid;
      blocker.style.backgroundColor = isSolid ? 'var(--blocker-solid)' : 'var(--blocker-semi)';
      const btn = document.getElementById('btn-opacity');
      btn.textContent = isSolid ? '当前：纯色' : '当前：半透明';
      logStatus(`方案 A：背景已切为 ${isSolid ? '不透明纯色' : '85% 半透明（观察是否重新触发模糊）'}`);
    }

    // 方案 C：JS 合成层欺骗 Hack
    function triggerCompositorHack() {
      logStatus('方案 C：正在执行固定图层滑入/滑出重排...');
      hackLayer.classList.add('active');
      setTimeout(() => {
        hackLayer.classList.remove('active');
        logStatus('方案 C：图层重排完成，请观察顶部模糊是否消失');
      }, 320);
    }

    // 方案 B：切换 status-bar-style
    function toggleStatusBarMeta() {
      metaMode = metaMode === 'black-translucent' ? 'default' : 'black-translucent';
      metaTag.setAttribute('content', metaMode);
      const btn = document.getElementById('btn-meta');
      btn.textContent = `Meta: ${metaMode}`;
      logStatus(`方案 B：已写入 apple-mobile-web-app-status-bar-style="${metaMode}"`);
    }

    // 方案 D：切换滚动容器
    function toggleScrollMode() {
      isInnerScroll = !isInnerScroll;
      document.body.className = isInnerScroll ? 'mode-inner-scroll' : 'mode-window-scroll';
      const btn = document.getElementById('btn-scroll');
      btn.textContent = isInnerScroll ? '滚动：内部容器' : '滚动：整页 Window';
      btn.classList.toggle('active', isInnerScroll);
      logStatus(`方案 D：已切换为 ${isInnerScroll ? '内部 div 独立滚动' : '默认整页 Window 滚动'}`);
    }

    // 标尺开关
    function toggleGuide() {
      showGuide = !showGuide;
      guide.style.display = showGuide ? 'block' : 'none';
      const btn = document.getElementById('btn-guide');
      btn.classList.toggle('active', showGuide);
      btn.textContent = showGuide ? '红色参考线：开' : '红色参考线：关';
    }

    // 生成测试滚动卡片
    const container = document.getElementById('feed-container');
    for (let i = 1; i <= 25; i++) {
      const div = document.createElement('div');
      div.className = 'feed-item';
      div.innerHTML = `
        <h3>测试内容段落 #${i} —— 观察穿过红线后的清晰度</h3>
        <p>向上滑动让文字与彩条进入灵动岛与状态栏区域，对比不同方案下是否仍有大面积渐进模糊。</p>
        <div class="color-bar"></div>
      `;
      container.appendChild(div);
    }
  </script>
</body>
</html>
