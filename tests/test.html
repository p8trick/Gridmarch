<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轻步兵 Low Poly 基础轮廓预览 (Three.js)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #2b2e33;
      color: #eef1f4;
      overflow: hidden;
      user-select: none;
    }
    #canvas-wrap { width: 100vw; height: 100vh; }

    /* 左上角信息与面数统计 */
    .hud-top {
      position: fixed;
      top: 14px;
      left: 14px;
      background: rgba(22, 25, 29, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      z-index: 10;
      min-width: 240px;
    }
    .hud-top h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f6d58e;
    }
    .stat-row { display: flex; justify-content: space-between; gap: 16px; }
    .stat-val { font-variant-numeric: tabular-nums; font-weight: 600; color: #7ee787; }
    .hint { margin-top: 6px; font-size: 11.5px; color: #a3adb8; }

    /* 底部控制栏 */
    .hud-bottom {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 25, 29, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      z-index: 10;
      max-width: 96vw;
    }
    .group { display: flex; align-items: center; gap: 6px; }
    .group-label { font-size: 12px; color: #9aa4b0; margin-right: 2px; }
    button {
      background: #383e47;
      color: #e6ebf0;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #474f5b; }
    button.active {
      background: #d9a441;
      color: #16181c;
      border-color: #f2c464;
      font-weight: 600;
    }
    .faction-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud-top">
    <h1>轻步兵 Low Poly 轮廓原型</h1>
    <div class="stat-row">
      <span>总三角面数 (Tris)：</span>
      <span class="stat-val" id="tri-count">计算中...</span>
    </div>
    <div class="stat-row">
      <span>网格部件数 (Meshes)：</span>
      <span class="stat-val" id="mesh-count">-</span>
    </div>
    <div class="hint">左键旋转 · 右键平移 · 滚轮缩放 · 快捷键 1~4 切换视角</div>
  </div>

  <div class="hud-bottom">
    <div class="group">
      <span class="group-label">阵营:</span>
      <button id="f-tan" class="active" data-faction="tan"><span class="faction-dot" style="background:#c5a874"></span>沙色默认</button>
      <button id="f-blue" data-faction="blue"><span class="faction-dot" style="background:#3b82f6"></span>蓝方</button>
      <button id="f-red" data-faction="red"><span class="faction-dot" style="background:#ef4444"></span>红方</button>
      <button id="f-green" data-faction="green"><span class="faction-dot" style="background:#65a30d"></span>绿方</button>
    </div>

    <div class="group">
      <span class="group-label">姿态:</span>
      <button id="p-idle" class="active" data-pose="idle">待机警戒</button>
      <button id="p-aim" data-pose="aim">瞄准</button>
      <button id="p-walk" data-pose="walk">行走</button>
      <button id="p-kneel" data-pose="kneel">蹲射</button>
    </div>

    <div class="group">
      <span class="group-label">视角:</span>
      <button data-cam="front">1 正面</button>
      <button data-cam="back">2 背面</button>
      <button data-cam="side">3 左侧</button>
      <button data-cam="iso">4 战棋俯角</button>
    </div>

    <div class="group">
      <button id="btn-wire">线框模式</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. 场景、相机、渲染器
    const container = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x52575e);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(1.6, 1.45, 2.35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.82, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 0.7;
    controls.maxDistance = 8;
    controls.update();

    // 2. 灯光与地面参考
    const hemiLight = new THREE.HemisphereLight(0xf3f5f8, 0x3b3e42, 0.95);
    hemiLight.position.set(0, 5, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff6e5, 1.75);
    dirLight.position.set(2.8, 4.2, 3.0);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 14;
    const d = 2.2;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x9ec5ff, 0.45);
    rimLight.position.set(-2.5, 2.2, -2.2);
    scene.add(rimLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 14),
      new THREE.MeshStandardMaterial({ color: 0x454950, roughness: 0.9, metalness: 0.0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(10, 20, 0x6b7280, 0x4e535c);
    grid.position.y = 0.001;
    scene.add(grid);

    // 3. 统一低多边形刻面材质工厂
    const materials = {};
    function getMat(key, colorHex, roughness = 0.78, metalness = 0.05) {
      if (!materials[key]) {
        materials[key] = new THREE.MeshStandardMaterial({
          color: colorHex,
          roughness,
          metalness,
          flatShading: true
        });
      }
      return materials[key];
    }

    const matSkin = getMat('skin', 0xe8be96, 0.75, 0.0);
    const matBrow = getMat('brow', 0x22201e, 0.85, 0.0);
    const matUniform = getMat('uniform', 0xc2a36b, 0.82, 0.02);
    const matUniformDark = getMat('uniformDark', 0xa88a55, 0.85, 0.02);
    const matVest = getMat('vest', 0x7a7c56, 0.8, 0.05);
    const matVestDark = getMat('vestDark', 0x5d6040, 0.84, 0.05);
    const matHelmet = getMat('helmet', 0xc5a874, 0.72, 0.08);
    const matHelmetDark = getMat('helmetDark', 0x8f774d, 0.78, 0.12);
    const matGearDark = getMat('gearDark', 0x2c3035, 0.65, 0.25);
    const matGunBody = getMat('gunBody', 0x25282c, 0.52, 0.45);
    const matGunMetal = getMat('gunMetal', 0x3b4048, 0.35, 0.75);
    const matArmband = getMat('armband', 0xc5a874, 0.75, 0.02);

    function addPart(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1], castShadow = true) {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...pos);
      mesh.rotation.set(...rot);
      mesh.scale.set(...scale);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // 4. 构建轻步兵层级骨架（便于切换姿势）
    const soldier = new THREE.Group();
    scene.add(soldier);

    const pelvis = new THREE.Group();
    pelvis.position.set(0, 0.66, 0);
    soldier.add(pelvis);

    const torso = new THREE.Group();
    torso.position.set(0, 0.06, 0);
    pelvis.add(torso);

    const headGroup = new THREE.Group();
    headGroup.position.set(0, 0.54, 0.01);
    torso.add(headGroup);

    // --- 头部与头盔 ---
    // Q版微方润脸型
    const headGeo = new THREE.BoxGeometry(0.31, 0.31, 0.30, 2, 2, 2);
    // 轻微削角让脸部更贴近参考图特写
    const hPos = headGeo.attributes.position;
    for (let i = 0; i < hPos.count; i++) {
      const vx = hPos.getX(i), vy = hPos.getY(i), vz = hPos.getZ(i);
      const shrink = 1 - 0.11 * (Math.abs(vx) / 0.155) * (Math.abs(vy) / 0.155) * (Math.abs(vz) / 0.15);
      hPos.setXYZ(i, vx * shrink, vy * shrink, vz * shrink);
    }
    headGeo.computeVertexNormals();
    addPart(headGroup, headGeo, matSkin, [0, 0.15, 0]);

    // 粗一字眉 & 眼睛
    addPart(headGroup, new THREE.BoxGeometry(0.068, 0.026, 0.02), matBrow, [-0.068, 0.175, 0.145], [0, 0, -0.05]);
    addPart(headGroup, new THREE.BoxGeometry(0.068, 0.026, 0.02), matBrow, [0.068, 0.175, 0.145], [0, 0, 0.05]);
    addPart(headGroup, new THREE.BoxGeometry(0.024, 0.042, 0.018), matBrow, [-0.068, 0.132, 0.144]);
    addPart(headGroup, new THREE.BoxGeometry(0.024, 0.042, 0.018), matBrow, [0.068, 0.132, 0.144]);

    // 战术头盔主体（低面半球/穹顶 + 护耳沿）
    const helmetDome = new THREE.SphereGeometry(0.188, 10, 7, 0, Math.PI * 2, 0, Math.PI * 0.58);
    addPart(headGroup, helmetDome, matHelmet, [0, 0.18, -0.005], [0.06, 0, 0], [1.04, 0.96, 1.08]);

    // 头盔侧护耳 & 后沿
    addPart(headGroup, new THREE.BoxGeometry(0.03, 0.105, 0.17), matHelmet, [-0.175, 0.165, -0.01], [0, 0, -0.14]);
    addPart(headGroup, new THREE.BoxGeometry(0.03, 0.105, 0.17), matHelmet, [0.175, 0.165, -0.01], [0, 0, 0.14]);
    addPart(headGroup, new THREE.BoxGeometry(0.28, 0.085, 0.04), matHelmet, [0, 0.175, -0.175], [-0.18, 0, 0]);

    // 前部 NVG 夜视仪支架（Shroud）+ 侧导轨
    addPart(headGroup, new THREE.BoxGeometry(0.075, 0.085, 0.03), matHelmetDark, [0, 0.235, 0.172], [-0.15, 0, 0]);
    addPart(headGroup, new THREE.BoxGeometry(0.052, 0.055, 0.02), matGearDark, [0, 0.232, 0.186], [-0.15, 0, 0]);
    addPart(headGroup, new THREE.BoxGeometry(0.018, 0.032, 0.13), matHelmetDark, [-0.186, 0.215, -0.01]);
    addPart(headGroup, new THREE.BoxGeometry(0.018, 0.032, 0.13), matHelmetDark, [0.186, 0.215, -0.01]);

    // 下巴带
    addPart(headGroup, new THREE.BoxGeometry(0.25, 0.024, 0.22), matGearDark, [0, 0.035, 0.015], [0.12, 0, 0]);

    // --- 躯干、作训服、战术背心与背包 ---
    // 脖子与躯干基础体块
    addPart(torso, new THREE.CylinderGeometry(0.068, 0.082, 0.08, 7), matSkin, [0, -0.01, 0]);
    addPart(torso, new THREE.BoxGeometry(0.32, 0.44, 0.20, 1, 2, 1), matUniform, [0, 0.23, 0]);
    addPart(pelvis, new THREE.BoxGeometry(0.31, 0.13, 0.20), matUniformDark, [0, 0.0, 0]);

    // 战术背心 / 胸挂
    addPart(torso, new THREE.BoxGeometry(0.345, 0.27, 0.232), matVest, [0, 0.27, 0.004]);
    // 胸前弹匣包（3个）
    for (let i = -1; i <= 1; i++) {
      addPart(torso, new THREE.BoxGeometry(0.052, 0.11, 0.036), matVestDark, [i * 0.064, 0.235, 0.132]);
    }
    // 腰封 / 杂物包
    addPart(torso, new THREE.BoxGeometry(0.065, 0.075, 0.04), matVestDark, [-0.145, 0.155, 0.115]);
    addPart(torso, new THREE.BoxGeometry(0.065, 0.075, 0.04), matVestDark, [0.145, 0.155, 0.115]);

    // 背面战术背包 + 侧袋
    const packGroup = new THREE.Group();
    packGroup.position.set(0, 0.26, -0.145);
    torso.add(packGroup);
    addPart(packGroup, new THREE.BoxGeometry(0.24, 0.28, 0.105), matVestDark, [0, 0, 0]);
    addPart(packGroup, new THREE.BoxGeometry(0.19, 0.13, 0.032), matVest, [0, -0.055, -0.062]);
    addPart(packGroup, new THREE.BoxGeometry(0.18, 0.075, 0.025), matVest, [0, 0.065, -0.058]);
    addPart(packGroup, new THREE.BoxGeometry(0.045, 0.16, 0.065), matVest, [-0.135, -0.02, -0.005]);
    addPart(packGroup, new THREE.BoxGeometry(0.045, 0.16, 0.065), matVest, [0.135, -0.02, -0.005]);

    // --- 左右手臂 + 阵营臂章 ---
    function createArm(side) {
      // side: -1 左臂, +1 右臂
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.205, 0.39, 0);
      torso.add(shoulder);

      // 大臂 + 阵营臂章
      addPart(shoulder, new THREE.BoxGeometry(0.105, 0.18, 0.105), matUniform, [0, -0.08, 0]);
      const band = addPart(shoulder, new THREE.BoxGeometry(0.114, 0.042, 0.114), matArmband, [0, -0.09, 0]);
      band.userData.isFactionBand = true;

      const elbow = new THREE.Group();
      elbow.position.set(0, -0.17, 0);
      shoulder.add(elbow);

      // 小臂作训袖 + 手掌
      addPart(elbow, new THREE.BoxGeometry(0.095, 0.16, 0.095), matUniformDark, [0, -0.075, 0]);
      addPart(elbow, new THREE.BoxGeometry(0.076, 0.075, 0.076), matSkin, [0, -0.175, 0]);

      return { shoulder, elbow };
    }

    const leftArm = createArm(-1);
    const rightArm = createArm(1);

    // --- 战术步枪（挂载在右手或双持参考区） ---
    const rifle = new THREE.Group();
    rightArm.elbow.add(rifle);
    // 枪身机匣
    addPart(rifle, new THREE.BoxGeometry(0.042, 0.068, 0.24), matGunBody, [0, 0, 0.04]);
    // 枪托
    addPart(rifle, new THREE.BoxGeometry(0.036, 0.115, 0.17), matGunBody, [0, -0.02, -0.14], [0.12, 0, 0]);
    // 前护木与枪管
    addPart(rifle, new THREE.BoxGeometry(0.046, 0.052, 0.20), matGunBody, [0, 0.005, 0.24]);
    addPart(rifle, new THREE.CylinderGeometry(0.011, 0.011, 0.16, 6), matGunMetal, [0, 0.008, 0.39], [Math.PI / 2, 0, 0]);
    // 弹匣（微倾）
    addPart(rifle, new THREE.BoxGeometry(0.032, 0.13, 0.058), matGunBody, [0, -0.085, 0.085], [0.22, 0, 0]);
    // 瞄准镜
    addPart(rifle, new THREE.CylinderGeometry(0.022, 0.022, 0.11, 7), matGunMetal, [0, 0.058, 0.04], [Math.PI / 2, 0, 0]);
    addPart(rifle, new THREE.BoxGeometry(0.026, 0.025, 0.06), matGunBody, [0, 0.04, 0.04]);

    // --- 左右腿 + 护膝 + 大腿侧袋 + 作战靴 ---
    function createLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.082, -0.05, 0);
      pelvis.add(hip);

      // 大腿 + 侧袋
      addPart(hip, new THREE.BoxGeometry(0.118, 0.27, 0.125), matUniform, [0, -0.135, 0]);
      addPart(hip, new THREE.BoxGeometry(0.026, 0.095, 0.085), matUniformDark, [side * 0.068, -0.15, 0.005]);

      const knee = new THREE.Group();
      knee.position.set(0, -0.27, 0);
      hip.add(knee);

      // 护膝
      addPart(knee, new THREE.BoxGeometry(0.105, 0.085, 0.035), matGearDark, [0, 0.005, 0.062]);

      // 小腿
      addPart(knee, new THREE.BoxGeometry(0.106, 0.25, 0.112), matUniformDark, [0, -0.13, 0]);

      // 作战靴
      addPart(knee, new THREE.BoxGeometry(0.112, 0.075, 0.175), matGearDark, [0, -0.275, 0.028]);

      return { hip, knee };
    }

    const leftLeg = createLeg(-1);
    const rightLeg = createLeg(1);

    // 5. 统计真实三角面数
    function updateStats() {
      let tris = 0;
      let meshes = 0;
      soldier.traverse((obj) => {
        if (obj.isMesh && obj.geometry) {
          meshes++;
          const g = obj.geometry;
          if (g.index) {
            tris += g.index.count / 3;
          } else if (g.attributes.position) {
            tris += g.attributes.position.count / 3;
          }
        }
      });
      document.getElementById('tri-count').textContent = Math.round(tris).toLocaleString();
      document.getElementById('mesh-count').textContent = meshes;
    }
    updateStats();

    // 6. 阵营与姿态切换逻辑
    const factions = {
      tan:   { band: 0xc5a874, helmet: 0xc5a874, helmetDark: 0x8f774d, uniform: 0xc2a36b, uniformDark: 0xa88a55 },
      blue:  { band: 0x3b82f6, helmet: 0x4b79b8, helmetDark: 0x335586, uniform: 0xc2a36b, uniformDark: 0xa88a55 },
      red:   { band: 0xef4444, helmet: 0xb85048, helmetDark: 0x82352f, uniform: 0xc2a36b, uniformDark: 0xa88a55 },
      green: { band: 0x65a30d, helmet: 0x779447, helmetDark: 0x546a30, uniform: 0x8fa356, uniformDark: 0x738540 }
    };

    function applyFaction(key) {
      const f = factions[key];
      if (!f) return;
      matArmband.color.setHex(f.band);
      matHelmet.color.setHex(f.helmet);
      matHelmetDark.color.setHex(f.helmetDark);
      matUniform.color.setHex(f.uniform);
      matUniformDark.color.setHex(f.uniformDark);
    }

    let currentPose = 'idle';
    function applyPose(pose, time = 0) {
      currentPose = pose;
      // 重置基准
      pelvis.position.set(0, 0.66, 0);
      pelvis.rotation.set(0, 0, 0);
      torso.rotation.set(0, 0, 0);
      headGroup.rotation.set(0, 0, 0);

      leftLeg.hip.rotation.set(0, 0, 0.04);
      leftLeg.knee.rotation.set(0, 0, 0);
      rightLeg.hip.rotation.set(0, 0, -0.04);
      rightLeg.knee.rotation.set(0, 0, 0);

      leftArm.shoulder.rotation.set(-0.45, 0.35, -0.18);
      leftArm.elbow.rotation.set(-0.85, 0, 0);
      rightArm.shoulder.rotation.set(-0.55, -0.22, 0.14);
      rightArm.elbow.rotation.set(-0.75, 0, 0);
      rifle.position.set(-0.03, -0.17, 0.14);
      rifle.rotation.set(0.28, 0.42, 0.15);

      if (pose === 'idle') {
        const breath = Math.sin(time * 2.2) * 0.012;
        torso.position.y = 0.06 + breath;
        leftArm.shoulder.rotation.x = -0.45 + Math.sin(time * 2.2) * 0.025;
      } else if (pose === 'aim') {
        pelvis.rotation.y = 0.25;
        torso.rotation.y = 0.22;
        torso.rotation.x = 0.06;
        headGroup.rotation.y = -0.25;
        rightArm.shoulder.rotation.set(-1.18, -0.15, 0.08);
        rightArm.elbow.rotation.set(-0.45, 0, 0);
        leftArm.shoulder.rotation.set(-0.95, 0.55, -0.1);
        leftArm.elbow.rotation.set(-0.95, 0, 0);
        rifle.position.set(0, -0.16, 0.16);
        rifle.rotation.set(0.08, 0.12, 0.02);
      } else if (pose === 'walk') {
        const s = Math.sin(time * 6.5);
        pelvis.position.y = 0.66 + Math.abs(Math.cos(time * 6.5)) * 0.025;
        pelvis.rotation.y = s * 0.12;
        leftLeg.hip.rotation.x = s * 0.52;
        leftLeg.knee.rotation.x = Math.max(0, -s * 0.65);
        rightLeg.hip.rotation.x = -s * 0.52;
        rightLeg.knee.rotation.x = Math.max(0, s * 0.65);
        leftArm.shoulder.rotation.x = -0.45 - s * 0.35;
        rightArm.shoulder.rotation.x = -0.55 + s * 0.25;
      } else if (pose === 'kneel') {
        // 蹲射姿态
        pelvis.position.set(0, 0.42, -0.02);
        pelvis.rotation.y = 0.32;
        torso.rotation.set(0.14, 0.2, 0);
        headGroup.rotation.set(-0.12, -0.32, 0);

        // 右腿跪地
        rightLeg.hip.rotation.set(-1.25, 0, -0.12);
        rightLeg.knee.rotation.set(1.65, 0, 0);
        // 左腿曲膝支撑
        leftLeg.hip.rotation.set(-0.95, 0.15, 0.15);
        leftLeg.knee.rotation.set(1.15, 0, 0);

        rightArm.shoulder.rotation.set(-1.12, -0.12, 0.08);
        rightArm.elbow.rotation.set(-0.5, 0, 0);
        leftArm.shoulder.rotation.set(-0.88, 0.5, -0.1);
        leftArm.elbow.rotation.set(-0.85, 0, 0);
        rifle.position.set(0, -0.16, 0.16);
        rifle.rotation.set(0.1, 0.1, 0);
      }
    }

    // 7. 视角预设与 UI 交互
    const camPresets = {
      front: { pos: [0, 0.9, 2.3], target: [0, 0.82, 0] },
      back:  { pos: [0, 0.9, -2.3], target: [0, 0.82, 0] },
      side:  { pos: [-2.3, 0.9, 0], target: [0, 0.82, 0] },
      iso:   { pos: [2.2, 2.1, 2.2], target: [0, 0.72, 0] }
    };

    function setCameraPreset(key) {
      const p = camPresets[key];
      if (!p) return;
      camera.position.set(...p.pos);
      controls.target.set(...p.target);
      controls.update();
    }

    document.querySelectorAll('[data-faction]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-faction]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyFaction(btn.dataset.faction);
      });
    });

    document.querySelectorAll('[data-pose]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-pose]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyPose(btn.dataset.pose, performance.now() * 0.001);
      });
    });

    document.querySelectorAll('[data-cam]').forEach((btn) => {
      btn.addEventListener('click', () => setCameraPreset(btn.dataset.cam));
    });

    let wireframeOn = false;
    document.getElementById('btn-wire').addEventListener('click', (e) => {
      wireframeOn = !wireframeOn;
      e.target.classList.toggle('active', wireframeOn);
      Object.values(materials).forEach((m) => {
        m.wireframe = wireframeOn;
      });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '1') setCameraPreset('front');
      if (e.key === '2') setCameraPreset('back');
      if (e.key === '3') setCameraPreset('side');
      if (e.key === '4') setCameraPreset('iso');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 8. 渲染循环
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      if (currentPose === 'idle' || currentPose === 'walk') {
        applyPose(currentPose, elapsed);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
