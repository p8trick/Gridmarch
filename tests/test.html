<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PWA顶栏测试v2" />
  <meta name="theme-color" content="#0b1021" id="meta-theme" />
  <title>PWA 顶栏测试 v2</title>
  <link rel="manifest" id="pwa-manifest" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b1021;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* 顶部最上沿色条：专门看灵动岛两侧是否被模糊/发白 */
    .top-strip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(90deg, #ef4444 0%, #f59e0b 25%, #10b981 50%, #3b82f6 75%, #ec4899 100%);
    }
    /* 偏方 1：顶部安全区微透明遮罩层 */
    #top-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top, 0px);
      background: transparent;
      z-index: 20;
      pointer-events: none;
    }
    /* 控制区：放在正常文档流中，不搞嵌套滚动死锁 */
    .wrap {
      position: relative;
      z-index: 30;
      padding: calc(env(safe-area-inset-top, 0px) + 54px) 14px 40px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #7dd3fc;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 6px 6px 0;
      font-size: 13px;
      touch-action: manipulation;
    }
    button.on {
      background: #0284c7;
      border-color: #38bdf8;
    }
    #log {
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="top-strip"></div>
  <div id="top-shield"></div>

  <div class="wrap">
    <div class="card">
      <div class="title">当前状态与点击反馈</div>
      <div id="log">等待点击测试...</div>
    </div>

    <div class="card">
      <div class="title">1. 顶部安全区遮罩（偏方 1）</div>
      <button id="b-off" class="on" onclick="setShield('transparent', 'env(safe-area-inset-top, 0px)', 'b-off')">关闭(全透)</button>
      <button id="b-002" onclick="setShield('rgba(0,0,0,0.02)', 'env(safe-area-inset-top, 0px)', 'b-002')">黑 0.02</button>
      <button id="b-01" onclick="setShield('rgba(0,0,0,0.1)', 'env(safe-area-inset-top, 0px)', 'b-01')">黑 0.10</button>
      <button id="b-black" onclick="setShield('#000000', 'env(safe-area-inset-top, 0px)', 'b-black')">纯黑</button>
    </div>

    <div class="card">
      <div class="title">2. 改写 theme-color（偏方 2）</div>
      <button onclick="setTheme('#010101')">改 #010101</button>
      <button onclick="setTheme('#0b1021')">改 #0b1021</button>
      <button onclick="setTheme('#dc2626')">改红色</button>
    </div>

    <div class="card">
      <div class="title">3. 背景明暗切换</div>
      <button id="bg-dark" class="on" onclick="setBg('#0b1021', '#f1f5f9', 'bg-dark')">深色背景</button>
      <button id="bg-light" onclick="setBg('#ffffff', '#0f172a', 'bg-light')">纯白背景</button>
    </div>
  </div>

  <script>
    (function () {
      try {
        var m = {
          name: "顶栏测试v2",
          short_name: "顶栏测试v2",
          start_url: location.href,
          display: "standalone",
          background_color: "#0b1021",
          theme_color: "#0b1021"
        };
        var blob = new Blob([JSON.stringify(m)], { type: "application/manifest+json" });
        document.getElementById("pwa-manifest").href = URL.createObjectURL(blob);
      } catch (e) {}
    })();

    function logMsg(txt) {
      var sat = getComputedStyle(document.documentElement).getPropertyValue("padding-top");
      var mode = window.navigator.standalone ? "Standalone" : "Safari";
      document.getElementById("log").innerHTML =
        "模式: <b>" + mode + "</b> | 窗口: " + innerWidth + "x" + innerHeight + "<br>" +
        "最近操作: <b>" + txt + "</b>";
    }

    function markGroup(btnId, prefix) {
      var btns = document.querySelectorAll("button[id^='" + prefix + "']");
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove("on");
      var cur = document.getElementById(btnId);
      if (cur) cur.classList.add("on");
    }

    function setShield(bg, h, btnId) {
      var el = document.getElementById("top-shield");
      el.style.background = bg;
      el.style.height = h;
      markGroup(btnId, "b-");
      logMsg("顶栏遮罩 -> " + bg);
    }

    function setTheme(color) {
      var meta = document.getElementById("meta-theme");
      if (meta) meta.setAttribute("content", color);
      logMsg("theme-color -> " + color);
    }

    function setBg(bg, fg, btnId) {
      document.documentElement.style.background = bg;
      document.body.style.background = bg;
      document.body.style.color = fg;
      markGroup(btnId, "bg-");
      logMsg("背景色 -> " + bg);
    }

    logMsg("页面已就绪");
  </script>
</body>
</html>
