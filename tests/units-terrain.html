
<!-- iOS 27 PWA 顶部毛玻璃实验：空白菜单动画 -->
<style>
  #gm-ios27-blur-cover {
    position: fixed;
    inset: 0;
    z-index: 2147483646;
    background: rgba(255, 255, 255, 0.01);
    pointer-events: none;
    display: none;
  }

  #gm-ios27-blur-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 90%;
    height: 100%;
    z-index: 2147483647;
    background: rgba(255, 255, 255, 0.01);
    pointer-events: none;
    transform: translateX(110%);
    transition: transform 300ms ease;
  }
</style>

<script>
(function () {
  const isIOS =
    /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' &&
     navigator.maxTouchPoints > 1);

  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    navigator.standalone === true;

  if (!isIOS || !isStandalone) return;

  function runBlankMenuExperiment() {
    if (document.getElementById('gm-ios27-blur-panel')) return;

    const cover = document.createElement('div');
    cover.id = 'gm-ios27-blur-cover';
    cover.setAttribute('aria-hidden', 'true');

    const panel = document.createElement('div');
    panel.id = 'gm-ios27-blur-panel';
    panel.setAttribute('aria-hidden', 'true');

    document.body.append(cover, panel);

    // 确保初始状态已经绘制
    void panel.offsetWidth;

    requestAnimationFrame(() => {
      cover.style.display = 'block';
      panel.style.transform = 'translateX(0)';

      setTimeout(() => {
        cover.style.display = 'none';
        panel.style.transform = 'translateX(110%)';

        // 保留 panel，不删除 DOM
      }, 500);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      runBlankMenuExperiment,
      { once: true }
    );
  } else {
    runBlankMenuExperiment();
  }
})();
</script>
<!-- iOS 27 PWA 顶部毛玻璃实验结束 -->
